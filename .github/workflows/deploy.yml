
name: Flask Application CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "620503470929"
  ECR_REPOSITORY: 8byte-devops-app
  EC2_INSTANCE_ID: i-088d976e6ec96ec39
  DB_PARAMETER_NAME: /8byte-devops/prod/db-password

jobs:

  # -----------------------------------
  # JOB 1: Application Testing
  # -----------------------------------
  test:
    name: Run Application Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          python -m pytest tests/ -v

  # -----------------------------------
  # JOB 2: Docker Build and ECR Push
  # -----------------------------------
  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::620503470929:role/GitHubActions-8Byte-DevOps
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  # -----------------------------------
  # JOB 3: Deploy to EC2 using SSM
  # -----------------------------------
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::620503470929:role/GitHubActions-8Byte-DevOps
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify EC2 SSM availability
        run: |
          aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text

      - name: Deploy application using SSM
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        shell: bash
        run: |
          set -euo pipefail

          # Create deployment script for execution on EC2.
          DEPLOY_SCRIPT=$(cat <<'REMOTE_SCRIPT'
          #!/bin/bash
          set -Eeuo pipefail

          IMAGE_URI="${IMAGE_URI:?IMAGE_URI is required}"

          DB_HOST="db-8byte-devops-postgres.c1ksmc4mixrx.ap-south-1.rds.amazonaws.com"
          DB_NAME="taskdb"
          DB_USER="appadmin"
          AWS_REGION="ap-south-1"
          ECR_REGISTRY="620503470929.dkr.ecr.ap-south-1.amazonaws.com"

          echo "Retrieving database password from Parameter Store..."

          DB_PASSWORD=$(aws ssm get-parameter \
            --name "/8byte-devops/prod/db-password" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text \
            --region "$AWS_REGION")

          echo "Authenticating with ECR..."

          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

          echo "Pulling new image: $IMAGE_URI"

          docker pull "$IMAGE_URI"

          # Save the currently deployed image for rollback.
          OLD_IMAGE=""

          if docker inspect flask-app >/dev/null 2>&1; then
            OLD_IMAGE=$(docker inspect \
              --format '{{.Config.Image}}' flask-app)

            echo "Previous image: $OLD_IMAGE"

            docker stop flask-app
            docker rm flask-app
          fi

          # Start application using the supplied image.
          start_application() {
            local image="$1"

            docker run -d \
              --name flask-app \
              --restart unless-stopped \
              -p 80:5000 \
              -e DB_HOST="$DB_HOST" \
              -e DB_PORT=5432 \
              -e DB_NAME="$DB_NAME" \
              -e DB_USER="$DB_USER" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              "$image"
          }

          rollback() {
            echo "Deployment failed. Starting rollback..."

            docker rm -f flask-app 2>/dev/null || true

            if [ -n "$OLD_IMAGE" ]; then
              echo "Restoring previous image: $OLD_IMAGE"

              start_application "$OLD_IMAGE"

              for i in $(seq 1 30); do
                if curl -fsS http://localhost/health \
                  | grep -q '"status":"healthy"'; then
                  echo "Rollback successful."
                  return 0
                fi

                sleep 5
              done

              echo "Rollback started, but health verification failed."
              docker logs --tail 100 flask-app || true
              return 1
            fi

            echo "No previous image available for rollback."
            return 1
          }

          echo "Starting new application..."

          if ! start_application "$IMAGE_URI"; then
            unset DB_PASSWORD
            rollback
            exit 1
          fi

          unset DB_PASSWORD

          echo "Checking application health..."

          for i in $(seq 1 30); do
            if curl -fsS http://localhost/health \
              | grep -q '"status":"healthy"'; then

              echo "Deployment successful."
              docker ps --filter name=flask-app
              exit 0
            fi

            sleep 5
          done

          echo "New application failed health verification."

          docker logs --tail 100 flask-app || true

          rollback
          exit 1
          REMOTE_SCRIPT
          )

          # Encode script so multiline commands survive SSM JSON parsing.
          SCRIPT_B64=$(printf '%s' "$DEPLOY_SCRIPT" | base64 -w 0)

          REMOTE_COMMAND="echo '$SCRIPT_B64' | base64 -d > /tmp/deploy-8byte.sh && chmod 700 /tmp/deploy-8byte.sh && IMAGE_URI='${IMAGE_URI}' /tmp/deploy-8byte.sh"

          PARAMETERS=$(jq -n \
            --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --comment "Deploy Flask application $GITHUB_SHA" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for SSM deployment result.
          for i in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "EC2 deployment completed successfully."
                exit 0
                ;;

              Failed|TimedOut|Cancelled)
                echo "EC2 deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "SSM command polling timed out."
          exit 1
